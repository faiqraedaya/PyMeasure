[project]
name = "PyMeasure"
version = "2.0.0"
description = "Desktop GUI for making precise measurements on images and PDFs."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pymupdf>=1.27.2.3",
    "pyside6>=6.11.1",
    "shapely>=2.0",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pymeasure"]
